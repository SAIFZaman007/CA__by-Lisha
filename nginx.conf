server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # `img-src` keeps `blob:` because the message composer previews a picked
    # file with URL.createObjectURL before it is uploaded. Gallery and message
    # images are served by the API on this same origin, so 'self' covers them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Search engines fetch these two from the site root, not from the API.
    #
    # Both are generated by the backend rather than shipped as static files,
    # because both list database-backed content — the live coaching tiers, the
    # published gallery — and a file baked into the frontend build goes stale
    # the first time the coach publishes a photo. Proxying keeps the canonical
    # URL (`/sitemap.xml`) while the content stays current.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_upstream http://api:8000;
        proxy_pass $seo_upstream/api/v1/meta/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_upstream http://api:8000;
        proxy_pass $seo_upstream/api/v1/meta/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Use Docker internal DNS to resolve dynamic upstreams at runtime without crashing at startup
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8000;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Covers the largest thing a browser posts here: a gallery image or a
        # message attachment plus multipart overhead. Tutorial videos are far
        # larger and are uploaded directly to the API, not through this proxy.
        client_max_body_size 12M;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}